<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本编号格式化工具</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f14;
      --bg-secondary: #1a1a24;
      --bg-card: #1e1e2e;
      --bg-input: #252535;
      --border: #2d2d42;
      --border-focus: #6c5ce7;
      --text-primary: #e8e8f0;
      --text-secondary: #9494a8;
      --text-muted: #6c6c80;
      --accent: #6c5ce7;
      --accent-hover: #7d6ff0;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --success: #2ed573;
      --success-glow: rgba(46, 213, 115, 0.2);
      --error: #ff6b81;
      --error-bg: rgba(255, 107, 129, 0.08);
      --gradient-1: linear-gradient(135deg, #6c5ce7 0%, #a855f7 100%);
      --gradient-2: linear-gradient(135deg, #0f0f14 0%, #1a1a2e 100%);
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(108, 92, 231, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(168, 85, 247, 0.04), transparent);
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      transition: border-color var(--transition);
    }

    .card:hover {
      border-color: rgba(108, 92, 231, 0.2);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 14px;
      background: var(--gradient-1);
      border-radius: 2px;
    }

    /* Number input */
    .number-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .number-row label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .number-input {
      width: 120px;
      padding: 10px 14px;
      font-size: 16px;
      font-family: 'Inter', monospace;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all var(--transition);
      text-align: center;
    }

    .number-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .number-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Textarea */
    .text-area {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      resize: vertical;
      transition: all var(--transition);
      tab-size: 4;
    }

    .text-area:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .text-area::placeholder {
      color: var(--text-muted);
    }

    .text-area.output {
      background: rgba(108, 92, 231, 0.04);
      border-color: rgba(108, 92, 231, 0.15);
      cursor: default;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: var(--gradient-1);
      color: #fff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(108, 92, 231, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .btn-copy {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 12px;
    }

    .btn-copy:hover {
      border-color: var(--success);
      color: var(--success);
    }

    .btn-copy.copied {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-glow);
    }

    /* Output section header */
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .output-header .card-title {
      margin-bottom: 0;
    }

    /* Error */
    .error-msg {
      display: none;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      background: var(--error-bg);
      border: 1px solid rgba(255, 107, 129, 0.15);
      border-radius: var(--radius-sm);
      margin-top: 12px;
    }

    .error-msg.visible {
      display: block;
      animation: slideIn 0.25s ease-out;
    }

    /* Line count badge */
    .line-count {
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 10px;
      background: var(--bg-input);
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 12px 24px;
      background: var(--bg-card);
      border: 1px solid var(--success);
      color: var(--success);
      font-size: 13px;
      font-weight: 500;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Animations */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      .header h1 { font-size: 22px; }
      .card { padding: 20px; }
      .number-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .btn-row { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📋 文本编号格式化</h1>
      <p>粘贴数据，自动提取并编号输出</p>
    </div>

    <!-- 输入区 -->
    <div class="card">
      <div class="card-title">输入设置</div>

      <div class="number-row">
        <label for="startNum">起始编号</label>
        <input type="number" id="startNum" class="number-input" value="0" min="0">
        <span class="number-hint">输出将从此编号 +1 开始</span>
      </div>

      <textarea
        id="inputText"
        class="text-area"
        placeholder="粘贴文本，每行格式如：S8:xj1234312|xj1234312|312312313&#10;支持不同前缀（S1、S8、S10 等）"
        spellcheck="false"
      ></textarea>

      <div id="errorMsg" class="error-msg"></div>
    </div>

    <!-- 按钮区 -->
    <div class="btn-row">
      <button class="btn btn-primary" onclick="convert()">
        ⚡ 转换
      </button>
      <button class="btn btn-secondary" onclick="clearAll()">
        🗑️ 清空
      </button>
    </div>

    <!-- 输出区 -->
    <div class="card" id="outputCard" style="display:none;">
      <div class="output-header">
        <div class="card-title">输出结果</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="line-count" id="lineCount">0 行</span>
          <button class="btn btn-copy" id="copyBtn" onclick="copyResult()">📋 复制</button>
        </div>
      </div>
      <textarea id="outputText" class="text-area output" readonly></textarea>
    </div>

    <div class="footer">
      双击打开即可使用 · 无需联网 · 数据不会离开本地
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">✅ 已复制到剪贴板</div>

  <script>
    // ===== 核心转换逻辑 =====
    function convert() {
      const startNum = parseInt(document.getElementById('startNum').value, 10);
      const rawText = document.getElementById('inputText').value.trim();
      const errorEl = document.getElementById('errorMsg');
      const outputCard = document.getElementById('outputCard');
      const outputText = document.getElementById('outputText');
      const lineCountEl = document.getElementById('lineCount');

      // 重置状态
      errorEl.classList.remove('visible');
      errorEl.textContent = '';

      // 校验
      if (isNaN(startNum) || startNum < 0) {
        showError('请输入有效的起始编号（非负整数）');
        return;
      }

      if (!rawText) {
        showError('请粘贴需要转换的文本');
        return;
      }

      // 按行处理
      const lines = rawText.split('\n').filter(line => line.trim() !== '');
      const results = [];
      const errors = [];
      let currentNum = startNum + 1;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        // 找冒号（支持中英文冒号）
        const colonIndex = Math.max(line.indexOf(':'), line.indexOf('：'));
        if (colonIndex === -1) {
          errors.push(`第 ${i + 1} 行缺少冒号分隔符: "${line.substring(0, 30)}..."`);
          continue;
        }

        const content = line.substring(colonIndex + 1);
        const parts = content.split('|');

        if (parts.length < 3) {
          errors.push(`第 ${i + 1} 行分段不足 3 段（仅 ${parts.length} 段）: "${line.substring(0, 30)}..."`);
          continue;
        }

        const value1 = parts[0].trim();
        const value3 = parts[2].trim();

        results.push(`号${currentNum}：${value1} ${value3}`);
        currentNum++;
      }

      // 有错误时显示警告但不阻止输出
      if (errors.length > 0 && results.length > 0) {
        showError(`⚠️ ${errors.length} 行格式异常已跳过：\n${errors.join('\n')}`);
      } else if (errors.length > 0 && results.length === 0) {
        showError(`所有行格式异常，无法转换：\n${errors.join('\n')}`);
        outputCard.style.display = 'none';
        return;
      }

      // 输出
      outputCard.style.display = 'block';
      outputCard.style.animation = 'slideIn 0.3s ease-out';
      outputText.value = results.join('\n');
      lineCountEl.textContent = `${results.length} 行`;

      // 自动调整输出框高度
      outputText.style.height = 'auto';
      outputText.style.height = Math.min(outputText.scrollHeight + 4, 400) + 'px';
    }

    // ===== 复制功能 =====
    function copyResult() {
      const text = document.getElementById('outputText').value;
      if (!text) return;

      navigator.clipboard.writeText(text).then(() => {
        // 按钮反馈
        const btn = document.getElementById('copyBtn');
        btn.classList.add('copied');
        btn.textContent = '✅ 已复制';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = '📋 复制';
        }, 2000);

        // Toast
        showToast();
      }).catch(() => {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast();
      });
    }

    // ===== 清空 =====
    function clearAll() {
      document.getElementById('startNum').value = '0';
      document.getElementById('inputText').value = '';
      document.getElementById('outputText').value = '';
      document.getElementById('outputCard').style.display = 'none';
      document.getElementById('errorMsg').classList.remove('visible');
    }

    // ===== 错误提示 =====
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('visible');
    }

    // ===== Toast =====
    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ===== 快捷键 =====
    document.addEventListener('keydown', function(e) {
      // Ctrl+Enter 转换
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        convert();
      }
    });
  </script>
</body>
</html>
