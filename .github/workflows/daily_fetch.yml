name: Daily AI Paper Fetch

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'   # 每天 UTC 06:00 (北京时间 14:00) 运行
  workflow_dispatch:        # 支持手动触发

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 90         # 翻译50篇论文需约60分钟，总预留90分钟

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Run paper fetcher
        if: github.event_name != 'push'
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          mkdir -p data/exports
          python run.py --days-back 7 --top-n 50
        working-directory: .
        timeout-minutes: 20

      - name: Translate top papers
        if: github.event_name != 'push'
        run: |
          mkdir -p data/translations
          python translate_papers.py --top-n 50
        working-directory: .
        timeout-minutes: 60

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # 将 data/exports 复制到 dist，前端直接读取
          mkdir -p ./dist/data/exports
          cp -r ../data/exports/* ./dist/data/exports/ 2>/dev/null || true
          # 将翻译文件复制到 dist
          mkdir -p ./dist/data/translations
          cp -r ../data/translations/* ./dist/data/translations/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          keep_files: true       # 保留已有数据文件，避免 push 触发的构建覆盖翻译等数据

      - name: Commit data files
        if: github.event_name != 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ --force
          git diff --staged --quiet || git commit -m "chore: daily paper update $(date -u +%Y-%m-%d)"
          git push
        continue-on-error: true

