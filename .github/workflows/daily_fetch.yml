name: Daily AI Paper Fetch

on:
  schedule:
    - cron: '0 6 * * *'   # 每天 UTC 06:00 (北京时间 14:00) 运行
  workflow_dispatch:        # 支持手动触发

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper fetcher
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          mkdir -p data/exports
          python run.py --days-back 7 --top-n 50
        working-directory: .

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # 将 data/exports 复制到 dist，前端直接读取
          cp -r ../data/exports ./dist/data/ 2>/dev/null || mkdir -p ./dist/data/exports && cp -r ../data/exports/* ./dist/data/exports/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          keep_files: false

      - name: Commit data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ --force
          git diff --staged --quiet || git commit -m "chore: daily paper update $(date -u +%Y-%m-%d)"
          git push
        continue-on-error: true
